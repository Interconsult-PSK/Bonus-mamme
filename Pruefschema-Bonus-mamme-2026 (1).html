<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfschema Bonus mamme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link rel="stylesheet" href="https://googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Arbeitsblatt in zwei Spalten. Links die Prüfschritte 1 bis 4, rechts das mitlaufende Ergebnis. Darunter Antrag und Rechtsgrundlagen. */
:root{
  --bg:#F2F4F8;--surface:#FFFFFF;--fg:#14213D;--muted:#566079;--line:#D3D9E5;
  --accent:#1F4FB4;--accent-ink:#FFFFFF;--accent-tint:#E3EBFA;
  --ok:#17744A;--ok-tint:#DFF2E7;--stop:#B3261E;--stop-tint:#FBE5E3;--warn:#85560A;--warn-tint:#FFEFC8;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424;--surface:#161E33;--fg:#E6EAF4;--muted:#9AA5C0;--line:#2A3552;
  --accent:#8BAEFF;--accent-ink:#0E1424;--accent-tint:#1B2A52;
  --ok:#62D69C;--ok-tint:#14352A;--stop:#FF8F86;--stop-tint:#3D1B1A;--warn:#F2C25B;--warn-tint:#3A2E10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424;--surface:#161E33;--fg:#E6EAF4;--muted:#9AA5C0;--line:#2A3552;
  --accent:#8BAEFF;--accent-ink:#0E1424;--accent-tint:#1B2A52;
  --ok:#62D69C;--ok-tint:#14352A;--stop:#FF8F86;--stop-tint:#3D1B1A;--warn:#F2C25B;--warn-tint:#3A2E10;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* --- ÄNDERUNG 1: Design des Sprach-Buttons --- */
.lang-switcher{display:flex;justify-content:flex-end;margin-bottom:-10px}
.lang-btn{font-family:var(--f-body);font-size:13px;font-weight:500;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease}
.lang-btn:hover{border-color:var(--accent);background:var(--accent-tint);color:var(--accent)}

header.top{display:flex;flex-direction:column;gap:10px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--accent-tint);border:1px solid var(--accent);border-radius:6px;padding:12px 16px}
.banner strong{font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.small{padding:5px 10px;font-size:13px}

.row{display:flex;flex-wrap:wrap;gap:8px}
.kids{display:flex;flex-direction:column;gap:8px}
.kidrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.kidrow label{font-size:13px;font-weight:600;min-width:56px}
.kidrow input{flex:1 1 160px;max-width:220px;width:auto}
.panel>details.plain{border:0;padding:0;background:transparent}
.panel>details.plain>summary{font-size:19px;font-weight:700}
.panel>details.plain>.tbl-wrap{margin-top:12px}
.more{border:0;background:transparent;padding:0}
.more>summary{font-size:13px;font-weight:600;color:var(--accent)}
.more[open]>summary{margin-bottom:4px}
.more .ref{font-weight:400;margin-left:6px}
.more .rules{margin-top:6px}
.apply{display:flex;flex-direction:column;gap:8px}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.phone{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px 14px}
.phone .num{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.phone .lab{font-size:12.5px;color:var(--muted)}
.hinweis{border:1px solid var(--warn);background:var(--warn-tint);color:var(--fg);border-radius:6px;padding:12px 16px}
.chip-btn:disabled{opacity:.45;cursor:not-allowed}
.chip-btn{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notice{font-size:13px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 340px}.result{position:sticky;top:16px}}
.steps{display:flex;flex-direction:column;gap:16px;min-width:0}

.step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.step-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.step-head .no{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 7px}
.step-head h2{flex:1 1 200px;min-width:0}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.status.ok{background:var(--ok-tint);color:var(--ok);border-color:var(--ok)}
.status.stop{background:var(--stop-tint);color:var(--stop);border-color:var(--stop)}
.status.warn{background:var(--warn-tint);color:var(--warn);border-color:var(--warn)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=number],input[type=date],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.m{font:inherit;display:flex;flex-direction:column;gap:2px;align-items:center;border:1px dashed var(--line);border-radius:6px;background:var(--bg);color:var(--muted);padding:8px 4px;cursor:pointer}
.m b{font-size:13px;color:var(--fg)}
.m span{font-size:12px}
.m[data-s="1"]{border:1px solid var(--accent);background:var(--accent-tint);color:var(--accent)}
.m[data-s="2"]{border:1px solid var(--warn);background:var(--warn-tint);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.bulk{display:flex;flex-wrap:wrap;gap:8px}

.result{background:var(--surface);border:2px solid var(--fg);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.result .big{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.result .verdict{font-weight:600}
.verdict.ok{color:var(--ok)}.verdict.stop{color:var(--stop)}.verdict.warn{color:var(--warn)}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mc{font-family:var(--f-mono);font-size:11px;text-align:center;border-radius:4px;padding:4px 0;}
</style>
</head>
<body>

<div class="wrap">
  <!-- --- ÄNDERUNG 2: Sichtbarer Sprach-Button --- -->
  <div class="lang-switcher">
    <a href="it.html" class="lang-btn">Italiano 🇮🇹</a>
  </div>

  <header class="top">
    <div class="eyebrow">INPS / Steuerrecht</div>
    <h1>Prüfschema Bonus mamme</h1>
  </header>

</div>

</body>
</html>
